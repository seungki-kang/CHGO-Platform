openapi: 3.1.0
info:
  title: CHGO Public & Headless OpenAPI v2 Consolidated Baseline
  version: 2.0.0-candidate.1
  description: Standalone consolidated candidate for Church OS, public/headless integration and Personal Vault.
    API major is /api/v2 and is independent of Church OS product version. Candidate is not runtime evidence. Raw
    Life Diary remains Personal Vault data; church membership is not Vault ownership; pastor access is aggregate-only;
    Coach access requires authority plus explicit user share; missing/deleted data is not zero growth. Raw diary,
    prayer, counseling, token, provider credential and key material must never be written to general logs, traces,
    errors, audit evidence or webhooks.
  x-artifact-id: CHGO-API-V2-CONSOLIDATED-01
  x-lifecycle: CANDIDATE
  x-execution-state: NOT_RUN
servers:
- url: /api/v2
  description: CHGO public/headless API v2 candidate baseline
tags:
- name: Today
- name: Formation
- name: Mission
- name: Care
- name: Prayer
- name: Privacy Gateway
- name: CHGO Bridge
- name: Pastor
- name: Headless
- name: Webhooks
- name: PersonalVault
- name: VaultEntries
- name: VaultShares
- name: VaultExport
- name: VaultDeletion
- name: VaultProviders
- name: VaultRecovery
- name: CoachShared
- name: ChurchAggregates
- name: VaultIntegrations
security:
- userBearer: []
paths:
  /me/today:
    get:
      summary: Get role-aware Today actions
      tags:
      - Today
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TodayAction'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      description: Operational Today remains available when CHGO Engine is unavailable.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      operationId: get_me_today
  /me/today/{action_id}:
    patch:
      summary: Update Today action state
      tags:
      - Today
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
