            schema:
              type: object
              required:
              - action_id
              - action_state
              - opportunity_state
              properties:
                action_id:
                  type: string
                  format: uuid
                action_state:
                  type: string
                opportunity_state:
                  type: string
                  enum:
                  - AVAILABLE
                  - NO_OPPORTUNITY
                  - UNKNOWN
                  - NOT_APPLICABLE
                occurred_at:
                  type:
                  - string
                  - 'null'
