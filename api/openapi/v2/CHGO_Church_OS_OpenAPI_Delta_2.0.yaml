openapi: 3.1.0
info:
  title: CHGO Church OS OpenAPI Delta
  version: 2.0.0
  description: Church OS 2.0 additive API delta. L3 Church OS remains operational SoR; protected CHGO exchanges
    pass through L4 Privacy Gateway and use pseudonymous minimum data. Candidate≠Evidence; Practice≠Outcome; Missing≠0;
    No Opportunity≠Failure; Pastor Aggregate Only.
servers:
- url: /api/v2
  description: Church OS 2.0 baseline
tags:
- name: Today
- name: Formation
- name: Mission
- name: Care
- name: Prayer
- name: Privacy Gateway
- name: CHGO Bridge
- name: Pastor
- name: Headless
- name: Webhooks
security:
- userBearer: []
paths:
  /me/today:
    get:
      summary: Get role-aware Today actions
      tags:
      - Today
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TodayAction'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      description: Operational Today remains available when CHGO Engine is unavailable.
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /me/today/{action_id}:
    patch:
      summary: Update Today action state
      tags:
      - Today
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - state
              properties:
                state:
                  type: string
                  enum:
                  - OPEN
                  - DISMISSED
                  - COMPLETED
  /formation/packs:
    get:
      summary: List enabled formation packs
      tags:
      - Formation
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FormationPack'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
