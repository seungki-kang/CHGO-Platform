        - webhook.manage
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscription'
components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceCredential:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            church.core.read: Read permitted Church OS operational resources
            formation.write: Write permitted formation operations
            mission.write: Write permitted mission operations
            growth.bridge.write: Submit purpose-bound pseudonymous events to Privacy Gateway
            growth.bridge.read: Read bounded CHGO responses
            pastor.aggregate.read: Read approved aggregate-only pastor insights
            webhook.manage: Manage tenant webhook subscriptions
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
          - INVALID_REQUEST
          - UNAUTHENTICATED
          - POLICY_DENIED
          - NOT_AVAILABLE
          - STATE_CONFLICT
          - CONTRACT_BLOCKED
          - PRIVACY_RATE_LIMIT
          - ENGINE_UNAVAILABLE
          - SUPPRESSED
          - HANDOFF
        detail:
          type: string
        request_id:
          type: string
        policy_version:
          type:
          - string
          - 'null'
        correlation_id:
          type:
          - string
          - 'null'
    PageMeta:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
    TodayAction:
      type: object
      required:
      - id
      - source_type
      - priority_class
      - action_route
      - state
      properties:
        id:
          type: string
          format: uuid
        source_type:
          type: string
        priority_class:
          type: string
        due_at:
          type:
          - string
          - 'null'
          format: date-time
        action_route:
          type: string
        state:
          type: string
        privacy_class:
          type: string
        provenance:
          type:
          - object
          - 'null'
          additionalProperties: true
    FormationPack:
      type: object
      required:
      - id
      - code
      - version
      - provider_type
      - status
      properties:
        id:
          type: string
          format: uuid
